apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: default
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["/bin/sh"]
    args:
      - -c
      - |
        echo "Starting load test against nginx-test service..."
        echo "This will generate traffic to demonstrate auto-scaling"
        while true; do
          wget -q -O- http://nginx-test.default.svc.cluster.local
        done
  restartPolicy: Never

