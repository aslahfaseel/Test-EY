apiVersion: v1
kind: Service
metadata:
  name: demo-app-service
  namespace: default
  labels:
    app: demo-app
spec:
  type: LoadBalancer
  selector:
    app: demo-app
    version: blue  # Initially pointing to blue deployment
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    name: http

